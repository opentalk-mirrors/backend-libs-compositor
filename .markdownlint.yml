# Enable all rules by default
---
default: true

# All unordered lists must use '-' consistently at all levels
MD004:
  style: dash

MD007:
  indent: 4

MD029:
  style: ordered

# Disable duplicate heading check
MD024: false

# Disable line length limit because markdown tables can't have linebreaks in them
MD013: false
